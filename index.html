<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kelvin · CS Student</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: #0f1115;
      background-image:
        radial-gradient(circle at 20% 20%, rgba(99, 102, 241, 0.25), transparent 45%),
        radial-gradient(circle at 80% 80%, rgba(16, 185, 129, 0.18), transparent 45%);
      color: #e6e8ee;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      width: 100%;
      max-width: 560px;
      padding: 48px 40px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      text-align: center;
    }

    .avatar {
      width: 84px;
      height: 84px;
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      font-weight: 700;
      color: #fff;
      border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, #10b981);
      box-shadow: 0 8px 24px rgba(99, 102, 241, 0.4);
      user-select: none;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 15px;
      color: #9ba3b4;
      margin-bottom: 6px;
    }

    .tag {
      display: inline-block;
      margin-top: 16px;
      padding: 5px 14px;
      font-size: 13px;
      color: #a5b4fc;
      border: 1px solid rgba(129, 140, 248, 0.35);
      border-radius: 999px;
      background: rgba(99, 102, 241, 0.12);
    }

    .divider {
      height: 1px;
      margin: 32px 0;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, 0.14),
        transparent
      );
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 15px 24px;
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      text-decoration: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      box-shadow: 0 10px 28px rgba(79, 70, 229, 0.35);
      transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.08);
      box-shadow: 0 14px 34px rgba(79, 70, 229, 0.5);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    footer {
      margin-top: 28px;
      font-size: 12px;
      color: #6b7280;
    }

    @media (max-width: 480px) {
      .card {
        padding: 36px 24px;
      }
      h1 {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="avatar">K</div>

    <h1>Hi, I'm Kelvin 👋</h1>
    <p class="subtitle">计算机科学专业学生 · Computer Science Student</p>
    <span class="tag">Coding · Learning · Building</span>

    <div class="divider"></div>

    <a class="btn" href="/md2">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
        <path d="M14 2v6h6" />
        <path d="M8 13h2l1.5 3L13 13h2" />
      </svg>
      打开 Markdown 编辑器
    </a>

    <footer>© <span id="year"></span> Kelvin</footer>
  </main>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
